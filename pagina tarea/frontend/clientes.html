<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- MENÚ DE NAVEGACIÓN -->
        <nav class="menu-principal">
            <div class="logo">
                <h1>🏪 Sistema Ventas</h1>
            </div>
            <ul class="menu-items">
                <li><a href="index.html">📊 Inicio</a></li>
                <li><a href="clientes.html" class="active">👤 Clientes</a></li>
                <li><a href="productos.html">📦 Productos</a></li>
                <li><a href="ventas.html">🧾 Ventas</a></li>
            </ul>
        </nav>

        <!-- CONTENIDO DE CLIENTES -->
        <main class="contenido">
            <div class="seccion-header">
                <h2>👤 Gestión de Clientes</h2>
                <p>Administra los clientes registrados en el sistema</p>
            </div>

            <!-- FORMULARIO AGREGAR CLIENTE -->
            <div class="formulario">
                <h3>➕ Agregar Nuevo Cliente</h3>
                <form id="formCliente">
                    <div class="form-grid">
                        <input type="text" id="cliId" placeholder="ID (ej: C001)" required>
                        <input type="text" id="cliNombre" placeholder="Nombre" required>
                        <input type="text" id="cliDireccion" placeholder="Dirección" required>
                        <input type="text" id="cliTelefono" placeholder="Teléfono (opcional)">
                        <input type="text" id="cliCiudad" placeholder="Ciudad" required>
                    </div>
                    <button type="submit" class="btn-agregar">Agregar Cliente</button>
                </form>
            </div>

            <!-- TABLA DE CLIENTES -->
            <div class="tabla-container">
                <div class="tabla-header">
                    <h3>📋 Lista de Clientes</h3>
                    <span class="contador" id="contadorClientes">0 clientes</span>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Dirección</th>
                            <th>Teléfono</th>
                            <th>Ciudad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaClientes">
                        <!-- Datos cargados con JavaScript -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
